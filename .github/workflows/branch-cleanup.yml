name: One-shot branch cleanup

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/branch-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete fully merged branches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          branches=(
            card-selection-drag
            feature-bookmark-hover-frame
            feature-cockpit-applications
            feature-debian-package
            feature-local-apt-update-test
            feature-update-notification
            feature-update-status-line
            fix-independent-page-elements
            fix-native-dropdown-theme
            fix-patternfly-selects
            fix-search-visibility-toggle
            floating-card-menu
            release-hardening
            release-v0.4.0
            release-v0.5.0
            starter-kit-trial
            v0.4-management
            v0.5-development
            v0.5-refactor
          )

          for branch in "${branches[@]}"; do
            if gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${branch}" >/dev/null 2>&1; then
              echo "Deleting ${branch}"
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}"
            else
              echo "Already absent: ${branch}"
            fi
          done
