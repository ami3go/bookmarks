name: Temp terminal editor freeze fix

on:
  push:
    branches:
      - fix-gotty-editor-freeze

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-gotty-editor-freeze
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply source patch
        run: python3 scripts/temp_fix_terminal_editor.py
      - name: Run tests
        run: npm ci && npm test
      - name: Build production bundle
        run: make clean && make
      - name: Verify interception removed
        run: |
          if grep -q gottyEditPassthrough src/gotty-launcher-manager.jsx; then exit 1; fi
          if grep -q "document.addEventListener('click', handleEditClick" src/gotty-launcher-manager.jsx; then exit 1; fi
          grep -q TERMINAL_LAUNCHER_EDIT_EVENT src/app.jsx
          grep -q TERMINAL_LAUNCHER_EDIT_EVENT src/gotty-launcher-manager.jsx
      - name: Commit tested fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/temp-fix-gotty-edit-freeze.yml scripts/temp_fix_terminal_editor.py
          git add src/app.jsx src/terminal-launcher.js src/gotty-launcher-manager.jsx
          git commit -m "Fix terminal launcher editor freeze"
          git push origin HEAD:fix-gotty-editor-freeze
