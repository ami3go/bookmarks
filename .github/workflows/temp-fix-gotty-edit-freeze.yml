name: Temp fix GoTTY edit freeze

on:
  push:
    branches:
      - fix-gotty-editor-freeze

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-gotty-editor-freeze
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Patch GoTTY editor routing
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}')
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'src/gotty-launcher.js',
              "export const GOTTY_LAUNCHER_TYPE = 'gotty-launcher';\nexport const GOTTY_LAUNCHER_PATH_PREFIX = '/cb-gotty-';",
              "export const GOTTY_LAUNCHER_TYPE = 'gotty-launcher';\nexport const GOTTY_LAUNCHER_EDIT_EVENT = 'cockpit-bookmarks:edit-gotty-launcher';\nexport const GOTTY_LAUNCHER_PATH_PREFIX = '/cb-gotty-';"
          )

          replace_once(
              'src/app.jsx',
              "import { ServiceDiscovery } from './service-discovery.jsx';",
              "import { ServiceDiscovery } from './service-discovery.jsx';\nimport { GOTTY_LAUNCHER_EDIT_EVENT, GOTTY_LAUNCHER_TYPE } from './gotty-launcher.js';"
          )

          replace_once(
              'src/app.jsx',
              "        clearWriteError('editor');\n        setSelectedBookmark(serviceSelectionKey(service));\n        const storedService = runtimeFreeService(service);\n        setDraft(editableBookmark(storedService));\n        setFormErrors({});\n        setEditor({\n            mode: 'edit',\n            target: { index: service.sourceIndex, service: storedService },\n        });",
              "        clearWriteError('editor');\n        setSelectedBookmark(serviceSelectionKey(service));\n        const storedService = runtimeFreeService(service);\n\n        if (storedService.type === GOTTY_LAUNCHER_TYPE) {\n            if (!storedService.id) {\n                setNotice({ variant: 'danger', text: 'This GoTTY launcher has no stable ID and cannot be edited safely.' });\n                return;\n            }\n            setEditor(null);\n            setFormErrors({});\n            window.dispatchEvent(new CustomEvent(GOTTY_LAUNCHER_EDIT_EVENT, { detail: { id: storedService.id } }));\n            return;\n        }\n\n        setDraft(editableBookmark(storedService));\n        setFormErrors({});\n        setEditor({\n            mode: 'edit',\n            target: { index: service.sourceIndex, service: storedService },\n        });"
          )

          replace_once(
              'src/gotty-launcher-manager.jsx',
              "    GOTTY_LAUNCHER_TYPE,\n    buildLauncherService,",
              "    GOTTY_LAUNCHER_EDIT_EVENT,\n    GOTTY_LAUNCHER_TYPE,\n    buildLauncherService,"
          )

          replace_once(
              'src/gotty-launcher-manager.jsx',
              "function cardIdentity(card) {\n    const titleSpans = card?.querySelectorAll?.('.bookmark-title-main > span') || [];\n    return {\n        name: titleSpans[1]?.textContent?.trim() || '',\n        description: card?.querySelector?.('.bookmark-description')?.textContent?.trim() || '',\n        section: card?.closest?.('.bookmark-group-section')?.querySelector?.('.bookmark-group-heading h2')?.textContent?.trim() || '',\n    };\n}\n\nfunction matchingLauncher(launchers, identity) {\n    const candidates = launchers.filter(service => {\n        if ((service?.name || '') !== identity.name)\n            return false;\n        if ((service?.description || '') !== identity.description)\n            return false;\n        if (identity.section && identity.section !== 'Favorites' && (service?.group || 'Ungrouped') !== identity.section)\n            return false;\n        return true;\n    });\n    return candidates.length === 1 ? candidates[0] : null;\n}\n\n",
              ""
          )

          old_effect = """    useEffect(() => {
        if (!allowed)
            return undefined;

        const passThrough = button => {
            button.dataset.gottyEditPassthrough = '1';
            button.click();
        };

        const handleEditClick = event => {
            const button = event.target?.closest?.('button.bookmark-action-menu-item');
            if (!button || button.textContent?.trim() !== 'Edit')
                return;

            if (button.dataset.gottyEditPassthrough === '1') {
                delete button.dataset.gottyEditPassthrough;
                return;
            }

            const card = button.closest('.bookmark-card');
            if (!card)
                return;

            const identity = cardIdentity(card);
            if (!identity.name || !identity.description)
                return;

            event.preventDefault();
            event.stopPropagation();

            readConfiguration()
                .then(config => {
                    const currentLaunchers = launchersFrom(config);
                    const service = matchingLauncher(currentLaunchers, identity);
                    if (!service) {
                        passThrough(button);
                        return;
                    }

                    setLaunchers(currentLaunchers);
                    beginEdit(service);
                    setOpen(true);
                })
                .catch(() => passThrough(button));
        };

        document.addEventListener('click', handleEditClick, true);
        return () => document.removeEventListener('click', handleEditClick, true);
    }, [allowed]);
"""

          new_effect = """    useEffect(() => {
        const handleLauncherEdit = async event => {
            const id = String(event.detail?.id || '').trim();
            if (!id)
                return;

            setNotice('');
            setErrors({});
            setDraft(null);
            setEditingId(null);
            try {
                const config = await readConfiguration();
                const currentLaunchers = launchersFrom(config);
                setLaunchers(currentLaunchers);
                const service = currentLaunchers.find(item => item?.id === id);
                if (!service)
                    throw new Error('The GoTTY launcher no longer exists. Reload the dashboard and try again.');
                setDraft(launcherDraft(service));
                setEditingId(service.id);
                setOpen(true);
            } catch (error) {
                setNotice(`Could not open GoTTY launcher editor: ${messageFor(error)}`);
                setOpen(true);
            }
        };

        window.addEventListener(GOTTY_LAUNCHER_EDIT_EVENT, handleLauncherEdit);
        return () => window.removeEventListener(GOTTY_LAUNCHER_EDIT_EVENT, handleLauncherEdit);
    }, []);
"""
          replace_once('src/gotty-launcher-manager.jsx', old_effect, new_effect)

          replace_once(
              'CHANGELOG.md',
              "- First-class GoTTY discovery: terminal-specific bookmark defaults, process-aware TLS/base-path inference, credential redaction, `--permit-write` warnings, and safe handling of random-URL mode.\n",
              "- First-class GoTTY discovery: terminal-specific bookmark defaults, process-aware TLS/base-path inference, credential redaction, `--permit-write` warnings, and safe handling of random-URL mode.\n- GoTTY launcher card editing now routes directly by stable launcher ID to the launcher-specific editor, removing the DOM click interception that could wedge Edit mode.\n"
          )

      - name: Run unit tests
        run: npm ci && npm test

      - name: Build production bundle
        run: make clean && make

      - name: Verify no DOM edit interception remains
        run: |
          ! grep -q "gottyEditPassthrough" src/gotty-launcher-manager.jsx
          ! grep -q "document.addEventListener('click', handleEditClick" src/gotty-launcher-manager.jsx
          grep -q "GOTTY_LAUNCHER_EDIT_EVENT" src/app.jsx
          grep -q "GOTTY_LAUNCHER_EDIT_EVENT" src/gotty-launcher-manager.jsx

      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/temp-fix-gotty-edit-freeze.yml
          git add src/app.jsx src/gotty-launcher.js src/gotty-launcher-manager.jsx CHANGELOG.md
          git commit -m "Fix GoTTY editor freeze"
          git push origin HEAD:fix-gotty-editor-freeze
