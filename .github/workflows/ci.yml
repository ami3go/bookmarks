name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run unit tests
        run: npm test

      - name: Test recursive source rebuilds
        shell: bash
        run: |
          set -euo pipefail
          make clean
          make dist
          before=$(stat -c %Y dist/index.js)

          sleep 1
          mkdir -p src/__build-dependency-probe__
          printf 'probe\n' > src/__build-dependency-probe__/probe.txt
          make dist
          after_add=$(stat -c %Y dist/index.js)
          test "$after_add" -gt "$before"

          sleep 1
          rm src/__build-dependency-probe__/probe.txt
          make dist
          after_delete=$(stat -c %Y dist/index.js)
          test "$after_delete" -gt "$after_add"
          rmdir src/__build-dependency-probe__

      - name: Test watch refreshes static files
        shell: bash
        run: |
          set -euo pipefail
          manifest_backup="$RUNNER_TEMP/cockpit-bookmarks-manifest.json"
          watch_log="$RUNNER_TEMP/cockpit-bookmarks-watch.log"
          cp src/manifest.json "$manifest_backup"
          watch_pid=""

          cleanup() {
            if [ -n "$watch_pid" ]; then
              kill -TERM "$watch_pid" 2>/dev/null || true
              wait "$watch_pid" 2>/dev/null || true
            fi
            cp "$manifest_backup" src/manifest.json
          }
          trap cleanup EXIT

          node build.js --watch >"$watch_log" 2>&1 &
          watch_pid=$!

          for _ in {1..100}; do
            if grep -q 'Watching src/' "$watch_log"; then
              break
            fi
            if ! kill -0 "$watch_pid" 2>/dev/null; then
              cat "$watch_log"
              exit 1
            fi
            sleep 0.1
          done
          grep -q 'Watching src/' "$watch_log"

          printf '\n' >> src/manifest.json
          for _ in {1..100}; do
            if cmp -s src/manifest.json dist/manifest.json; then
              break
            fi
            if ! kill -0 "$watch_pid" 2>/dev/null; then
              cat "$watch_log"
              exit 1
            fi
            sleep 0.1
          done
          cmp -s src/manifest.json dist/manifest.json

      - name: Build release artifacts
        run: make release-all

      - name: Verify release files
        run: |
          version=$(node -p "require('./package.json').version")
          root="cockpit-bookmarks-${version}"
          archive="release/${root}.tar.gz"
          deb="release/cockpit-bookmarks_${version}-2_all.deb"
          test -s dist/index.html
          test -s dist/index.css
          test -s dist/index.js
          test -s dist/manifest.json
          test ! -e dist/index.js.map
          test ! -e dist/index.css.map
          test -s "$archive"
          test -s "$deb"
          tar -tzf "$archive" | grep -Fx "$root/dist/index.html"
          tar -tzf "$archive" | grep -Fx "$root/Makefile"
          tar -tzf "$archive" | grep -Fx "$root/package.json"
          tar -tzf "$archive" | grep -Fx "$root/LICENSE"
          tar -tzf "$archive" | grep -Fx "$root/packaging/build-deb.sh"
          tar -tzf "$archive" | grep -Fx "$root/packaging/debian/io.github.ami3go.cockpit_bookmarks.metainfo.xml"
          dpkg-deb --contents "$deb" | grep -q 'usr/share/cockpit/cockpit-bookmarks/index.html$'
          dpkg-deb --contents "$deb" | grep -q 'usr/share/metainfo/io.github.ami3go.cockpit_bookmarks.metainfo.xml$'

      - name: Test prebuilt install without Node.js
        run: |
          version=$(node -p "require('./package.json').version")
          root="cockpit-bookmarks-${version}"
          archive="release/${root}.tar.gz"
          workdir=$(mktemp -d)
          tar -xzf "$archive" -C "$workdir"

          env PATH=/usr/bin:/bin make -C "$workdir/$root" \
            DESTDIR="$workdir/root" install-prebuilt install-config

          plugin_dir="$workdir/root/usr/local/share/cockpit/cockpit-bookmarks"
          config="$workdir/root/etc/cockpit/cockpit-bookmarks.json"
          test -s "$plugin_dir/index.html"
          test -s "$plugin_dir/index.css"
          test -s "$plugin_dir/index.js"
          test -s "$plugin_dir/manifest.json"
          test -s "$config"

          printf '%s\n' '{"title":"Preserve me","services":[]}' > "$config"
          before=$(sha256sum "$config" | cut -d' ' -f1)

          env PATH=/usr/bin:/bin make -C "$workdir/$root" \
            DESTDIR="$workdir/root" uninstall
          test ! -e "$plugin_dir"
          test -s "$config"

          env PATH=/usr/bin:/bin make -C "$workdir/$root" \
            DESTDIR="$workdir/root" install-prebuilt install-config
          test -s "$plugin_dir/index.html"
          after=$(sha256sum "$config" | cut -d' ' -f1)
          test "$before" = "$after"

      - name: Test Debian package
        run: sh tests/deb-package.sh

      - name: Upload production bundle
        uses: actions/upload-artifact@v4
        with:
          name: cockpit-bookmarks-dist
          path: dist/
          if-no-files-found: error

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cockpit-bookmarks-release
          path: |
            release/cockpit-bookmarks-*.tar.gz
            release/cockpit-bookmarks_*.deb
          if-no-files-found: error
