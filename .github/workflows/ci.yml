name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run unit tests
        run: npm test

      - name: Build release archive
        run: make release

      - name: Verify release files
        run: |
          test -s dist/index.html
          test -s dist/index.css
          test -s dist/index.js
          test -s dist/manifest.json
          test ! -e dist/index.js.map
          test ! -e dist/index.css.map
          test -s release/cockpit-bookmarks-0.4.0.tar.gz
          tar -tzf release/cockpit-bookmarks-0.4.0.tar.gz | grep -Fx 'cockpit-bookmarks-0.4.0/dist/index.html'
          tar -tzf release/cockpit-bookmarks-0.4.0.tar.gz | grep -Fx 'cockpit-bookmarks-0.4.0/Makefile'
          tar -tzf release/cockpit-bookmarks-0.4.0.tar.gz | grep -Fx 'cockpit-bookmarks-0.4.0/LICENSE'

      - name: Upload production bundle
        uses: actions/upload-artifact@v4
        with:
          name: cockpit-bookmarks-dist
          path: dist/
          if-no-files-found: error

      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: cockpit-bookmarks-release
          path: release/cockpit-bookmarks-0.4.0.tar.gz
          if-no-files-found: error
