name: Finish GoTTY card editing

on:
  push:
    branches:
      - feature-edit-gotty-card
    paths:
      - .github/workflows/finish-gotty-card-edit.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature-edit-gotty-card
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Patch GoTTY card editing
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manager = Path('src/gotty-launcher-manager.jsx')
          text = manager.read_text()

          old = "const PRESETS = [\n"
          new = "export const GOTTY_LAUNCHER_EDIT_EVENT = 'cockpit-bookmarks:edit-gotty-launcher';\n\nconst PRESETS = [\n"
          assert old in text and 'GOTTY_LAUNCHER_EDIT_EVENT' not in text
          text = text.replace(old, new, 1)

          marker = "    const refresh = async () => {\n"
          effect = """    useEffect(() => {
        const handleEditRequest = async event => {
            const id = String(event.detail?.id || '').trim();
            if (!id)
                return;

            setNotice('');
            setErrors({});
            try {
                const config = await readConfiguration();
                const nextLaunchers = launchersFrom(config);
                setLaunchers(nextLaunchers);
                const service = nextLaunchers.find(item => item?.id === id);
                if (!service)
                    throw new Error('The GoTTY launcher bookmark no longer exists.');

                setDraft(launcherDraft(service));
                setEditingId(service.id);
                setOpen(true);
            } catch (error) {
                setNotice(`Could not edit GoTTY launcher: ${messageFor(error)}`);
                setOpen(true);
            }
        };

        window.addEventListener(GOTTY_LAUNCHER_EDIT_EVENT, handleEditRequest);
        return () => window.removeEventListener(GOTTY_LAUNCHER_EDIT_EVENT, handleEditRequest);
    }, []);

"""
          assert marker in text
          text = text.replace(marker, effect + marker, 1)

          old = """        try {
            await modifyConfiguration(current => {
"""
          new = """        try {
            if (editingId) {
                const existing = launchers.find(service => service?.id === editingId);
                if (existing)
                    await stopGoTTYLauncher(window.cockpit, existing);
            }

            await modifyConfiguration(current => {
"""
          assert old in text
          text = text.replace(old, new, 1)

          old = """                                <div className=\"bookmark-field-help\">Examples: <code>mc</code>, <code>btop</code>, <code>fish</code>, or an absolute executable path.</div>
"""
          new = """                                <div className=\"bookmark-field-help\">Examples: <code>mc</code>, <code>btop</code>, <code>fish</code>, or an absolute path such as <code>/usr/bin/fish</code>. Use <code>command -v fish</code> to find it.</div>
"""
          assert old in text
          text = text.replace(old, new, 1)

          old = """                                <TextInput id=\"gotty-launcher-binary\" value={draft.binary} onChange={(_event, value) => update('binary', value)} placeholder=\"gotty\" validated={errors.binary ? 'error' : 'default'} />
                                {errors.binary && <div className=\"bookmark-field-error\">{errors.binary}</div>}
"""
          new = """                                <TextInput id=\"gotty-launcher-binary\" value={draft.binary} onChange={(_event, value) => update('binary', value)} placeholder=\"/usr/local/bin/gotty\" validated={errors.binary ? 'error' : 'default'} />
                                {errors.binary && <div className=\"bookmark-field-error\">{errors.binary}</div>}
                                <div className=\"bookmark-field-help\">Use <code>command -v gotty</code> to find the executable. A typical manual install is <code>/usr/local/bin/gotty</code>.</div>
"""
          assert old in text
          text = text.replace(old, new, 1)

          manager.write_text(text)

          sections = Path('src/bookmark-sections.jsx')
          text = sections.read_text()
          old = """                                                                                onClick={event => {
                                                                                    closeActionMenu(event);
                                                                                    onOpenEdit(service);
                                                                                }}
                                                                                disabled={saving}
                                                                            >
                                                                                Edit
"""
          new = """                                                                                onClick={event => {
                                                                                    closeActionMenu(event);
                                                                                    if (service.type === 'gotty-launcher' && service.id) {
                                                                                        window.dispatchEvent(new CustomEvent('cockpit-bookmarks:edit-gotty-launcher', {
                                                                                            detail: { id: service.id },
                                                                                        }));
                                                                                    } else {
                                                                                        onOpenEdit(service);
                                                                                    }
                                                                                }}
                                                                                disabled={saving}
                                                                            >
                                                                                {service.type === 'gotty-launcher' ? 'Edit GoTTY launcher…' : 'Edit'}
"""
          assert old in text
          text = text.replace(old, new, 1)
          sections.write_text(text)

          docs = Path('docs/GOTTY-LAUNCHERS.md')
          text = docs.read_text()
          anchor = "## Runtime model\n"
          addition = """## Editing from a bookmark card

Enable Bookmarks **Edit mode**, open the card's three-dot action menu, and choose **Edit GoTTY launcher…**. This opens the full launcher editor rather than the generic bookmark editor.

The card editor exposes the application command, one-argument-per-line argv list, TCP port, listen address, auto-stop time, GoTTY executable, group, icon, and accent. Absolute executable paths such as `/usr/local/bin/gotty` and `/usr/bin/fish` are supported and are recommended when a systemd user service has a different `PATH` from an interactive shell.

Saving an existing launcher stops its current transient GoTTY unit first so the next click always uses the newly saved parameters.

"""
          assert anchor in text and 'Editing from a bookmark card' not in text
          text = text.replace(anchor, addition + anchor, 1)
          docs.write_text(text)

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text()
          anchor = "- First-class GoTTY discovery: terminal-specific bookmark defaults, process-aware TLS/base-path inference, credential redaction, `--permit-write` warnings, and safe handling of random-URL mode.\n"
          addition = anchor + "- On-demand GoTTY launcher cards can be edited directly from their card action menu, including executable paths, command arguments, port, bind address, timeout, and presentation fields. Saving edits stops any active launcher so new parameters take effect on the next launch.\n"
          assert anchor in text and 'On-demand GoTTY launcher cards can be edited directly' not in text
          text = text.replace(anchor, addition, 1)
          changelog.write_text(text)
          PY
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Build production bundle
        run: make clean && make
      - name: Check patch
        run: git diff --check
      - name: Commit finished implementation
        run: |
          rm .github/workflows/finish-gotty-card-edit.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/gotty-launcher-manager.jsx src/bookmark-sections.jsx docs/GOTTY-LAUNCHERS.md CHANGELOG.md .github/workflows/finish-gotty-card-edit.yml
          git commit -m "Make GoTTY launcher cards fully editable"
          git push origin HEAD:feature-edit-gotty-card
