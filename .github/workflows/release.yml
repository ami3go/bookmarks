name: Release

on:
  workflow_dispatch:
  # Workflow changes merged to main deliberately exercise the full release path.
  push:
    branches:
      - main
    paths:
      - .github/workflows/release.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run unit tests
        run: npm test

      - name: Build release archive
        run: make release

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")"
          TAG="v${VERSION}"
          ARCHIVE="release/cockpit-bookmarks-${VERSION}.tar.gz"
          CHECKSUM="${ARCHIVE}.sha256"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to overwrite it." >&2
            exit 1
          fi

          test -s "$ARCHIVE"
          sha256sum "$ARCHIVE" > "$CHECKSUM"

          awk -v version="$VERSION" '
            $0 ~ "^## \\[" version "\\]" { capture=1; next }
            capture && $0 ~ "^## \\[" { exit }
            capture { print }
          ' CHANGELOG.md > release-notes.md

          test -s release-notes.md

          gh release create "$TAG" \
            "${ARCHIVE}#Prebuilt Cockpit Bookmarks ${VERSION}" \
            "${CHECKSUM}#SHA-256 checksum" \
            --target "$GITHUB_SHA" \
            --title "Cockpit Bookmarks ${TAG}" \
            --notes-file release-notes.md

          gh release view "$TAG" --json tagName,isDraft,isPrerelease,assets,url
