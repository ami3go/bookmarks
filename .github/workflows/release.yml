name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run tests
        run: npm test

      - name: Build release artifacts
        run: make release-all

      - name: Validate release version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")"
          TAG="v${VERSION}"
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ] && [ "${GITHUB_REF_NAME:-}" != "$TAG" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version ${VERSION}." >&2
            exit 1
          fi

      - name: Attest release archive provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: release/cockpit-bookmarks-*.tar.gz

      - name: Attest Debian package provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: release/cockpit-bookmarks_*.deb

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")"
          DEB_REVISION="$(awk '/^DEB_REVISION[[:space:]]*\?=/{print $3; exit}' Makefile)"
          TAG="v${VERSION}"
          ARCHIVE="release/cockpit-bookmarks-${VERSION}.tar.gz"
          ARCHIVE_CHECKSUM="${ARCHIVE}.sha256"
          DEB="release/cockpit-bookmarks_${VERSION}-${DEB_REVISION}_all.deb"
          DEB_CHECKSUM="${DEB}.sha256"

          test -n "$DEB_REVISION"
          test -s "$ARCHIVE"
          test -s "$DEB"
          sha256sum "$ARCHIVE" > "$ARCHIVE_CHECKSUM"
          sha256sum "$DEB" > "$DEB_CHECKSUM"

          awk -v version="$VERSION" '
            $0 ~ "^## \\[" version "\\]" { capture=1; next }
            capture && $0 ~ "^## \\[" { exit }
            capture { print }
          ' CHANGELOG.md > release-notes.md

          test -s release-notes.md

          upload_if_missing() {
            file="$1"
            label="$2"
            name="$(basename "$file")"
            if gh release view "$TAG" --json assets --jq '.assets[].name' | grep -Fxq "$name"; then
              echo "Release asset $name already exists; keeping it unchanged."
            else
              gh release upload "$TAG" "${file}#${label}"
            fi
          }

          if gh release view "$TAG" >/dev/null 2>&1; then
            changed_app_inputs="$(git diff --name-only "$TAG" "$GITHUB_SHA" -- src package.json package-lock.json build.js examples)"
            if [ -n "$changed_app_inputs" ]; then
              echo "Release $TAG exists, but application inputs changed since the tag:" >&2
              printf '%s\n' "$changed_app_inputs" >&2
              echo "Bump the application version before publishing new release assets." >&2
              exit 1
            fi

            upload_if_missing "$ARCHIVE" "Prebuilt Cockpit Bookmarks ${VERSION}"
            upload_if_missing "$ARCHIVE_CHECKSUM" "Prebuilt archive SHA-256 checksum"
            upload_if_missing "$DEB" "Debian/Ubuntu package ${VERSION}-${DEB_REVISION}"
            upload_if_missing "$DEB_CHECKSUM" "Debian package SHA-256 checksum"
          else
            gh release create "$TAG" \
              "${ARCHIVE}#Prebuilt Cockpit Bookmarks ${VERSION}" \
              "${ARCHIVE_CHECKSUM}#Prebuilt archive SHA-256 checksum" \
              "${DEB}#Debian/Ubuntu package ${VERSION}-${DEB_REVISION}" \
              "${DEB_CHECKSUM}#Debian package SHA-256 checksum" \
              --target "$GITHUB_SHA" \
              --title "Cockpit Bookmarks ${TAG}" \
              --notes-file release-notes.md
          fi

          gh release view "$TAG" --json tagName,isDraft,isPrerelease,assets,url
