name: Apply v0.6 dashboard features

on:
  push:
    branches:
      - v0.6-dashboard-features
    paths:
      - scripts/apply-v06-dashboard.py
      - .github/workflows/v06-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: v0.6-dashboard-features
          fetch-depth: 0

      - name: Apply source transformation
        run: python3 scripts/apply-v06-dashboard.py

      - name: Install QR dependency
        run: npm install qrcode@1.5.4 --save-exact

      - name: Run tests
        run: npm test

      - name: Build production bundle
        run: NODE_ENV=production npm run build

      - name: Commit generated feature set
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md README.md package.json package-lock.json src tests
          git commit -m "Implement v0.6 dashboard user features"
          git push origin HEAD:v0.6-dashboard-features
