name: Patch terminal launcher edit listener

on:
  push:
    branches:
      - fix-terminal-launcher-edit-listener

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[terminal-edit-listener]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-terminal-launcher-edit-listener
          fetch-depth: 0
      - name: Add terminal launcher edit listener
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manager = Path('src/terminal-launcher-manager.jsx')
          text = manager.read_text()

          old_import = """import {\n    TERMINAL_LAUNCHER_TYPE,\n    TERMINAL_PROVIDER_GOTTY,\n"""
          new_import = """import {\n    TERMINAL_LAUNCHER_EDIT_EVENT,\n    TERMINAL_LAUNCHER_TYPE,\n    TERMINAL_PROVIDER_GOTTY,\n"""
          if old_import not in text:
              raise SystemExit('terminal launcher import pattern not found')
          text = text.replace(old_import, new_import, 1)

          anchor = """    useEffect(() => {\n        const permission = window.cockpit.permission({ admin: true });\n        const updatePermission = () => setAllowed(permission.allowed === true);\n        updatePermission();\n        permission.addEventListener('changed', updatePermission);\n        return () => {\n            permission.removeEventListener('changed', updatePermission);\n            permission.close();\n        };\n    }, []);\n\n"""
          addition = anchor + """    useEffect(() => {\n        const handleEditRequest = async event => {\n            const id = String(event.detail?.id || '');\n            if (!id)\n                return;\n\n            setNotice('');\n            try {\n                const config = await readConfiguration();\n                const currentLaunchers = launchersFrom(config);\n                const service = currentLaunchers.find(item => item?.id === id);\n                setLaunchers(currentLaunchers);\n                setOpen(true);\n\n                if (!service) {\n                    setDraft(null);\n                    setEditingId(null);\n                    setNotice('The terminal launcher no longer exists. Reload the page and try again.');\n                    return;\n                }\n\n                setDraft(launcherDraft(service));\n                setEditingId(service.id);\n                setErrors({});\n            } catch (error) {\n                setDraft(null);\n                setEditingId(null);\n                setOpen(true);\n                setNotice(`Could not open launcher editor: ${messageFor(error)}`);\n            }\n        };\n\n        window.addEventListener(TERMINAL_LAUNCHER_EDIT_EVENT, handleEditRequest);\n        return () => window.removeEventListener(TERMINAL_LAUNCHER_EDIT_EVENT, handleEditRequest);\n    }, []);\n\n"""
          if anchor not in text:
              raise SystemExit('permission effect pattern not found')
          manager.write_text(text.replace(anchor, addition, 1))

          test = Path('tests/terminal-launcher-card-edit.test.mjs')
          test.write_text("""import test from 'node:test';\nimport assert from 'node:assert/strict';\nimport fs from 'node:fs';\n\nconst app = fs.readFileSync(new URL('../src/app.jsx', import.meta.url), 'utf8');\nconst manager = fs.readFileSync(new URL('../src/terminal-launcher-manager.jsx', import.meta.url), 'utf8');\n\ntest('terminal launcher card Edit dispatches and handles the same edit event', () => {\n    assert.match(app, /new CustomEvent\\(TERMINAL_LAUNCHER_EDIT_EVENT/);\n    assert.match(manager, /addEventListener\\(TERMINAL_LAUNCHER_EDIT_EVENT, handleEditRequest\\)/);\n    assert.match(manager, /setDraft\\(launcherDraft\\(service\\)\\)/);\n    assert.match(manager, /setEditingId\\(service.id\\)/);\n});\n""")

          Path('.github/workflows/patch-terminal-launcher-edit-listener.yml').unlink()
          PY
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Fix terminal launcher card edit routing [terminal-edit-listener]"
          git push origin HEAD:fix-terminal-launcher-edit-listener
